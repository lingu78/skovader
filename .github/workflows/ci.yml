name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Regelmotor (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: Engine
        run: swift test

  ios:
    name: App (iOS-simulator)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode-version
        run: xcodebuild -version
      - name: Installera XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Generera projektet
        run: xcodegen generate
      - name: Bygg och testa
        run: |
          SIMULATOR_ID=$(python3 scripts/pick-simulator.py)
          xcodebuild test \
            -project Skovader.xcodeproj \
            -scheme Skovader \
            -destination "id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO \
            > xcodebuild.log 2>&1 && STATUS=0 || STATUS=$?
          grep -E "error:|warning: .*\.swift|Test Case .* failed|Executed [0-9]+ test|\*\* (BUILD|TEST)" xcodebuild.log | sort -u | head -300 || true
          echo "--- slutet av loggen ---"
          tail -40 xcodebuild.log
          exit $STATUS
