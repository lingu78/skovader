name: TestFlight

# Bygger, signerar och laddar upp Skoväder till TestFlight på en Mac hos
# GitHub. Startas för hand: Actions → TestFlight → Run workflow.
# Engångsförberedelser: docs/testflight.md.
on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Bygg och ladda upp
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      BUNDLE_ID: no.linus.skovader
      # Key ID och Issuer ID är inte hemliga och får också ligga som variabler.
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || vars.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || vars.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: API-nyckel
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          P8_IS_VARIABLE: ${{ vars.ASC_KEY_P8 != '' }}
        run: |
          if [ -z "$ASC_KEY_P8" ] && [ "$P8_IS_VARIABLE" = "true" ]; then
            echo "::error::ASC_KEY_P8 ligger under Variables. Den är hemlig – ta bort variabeln och lägg in den under Secrets i stället."
            exit 1
          fi
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Saknar:$missing. Lägg in dem i repot skovader under Settings → Secrets and variables → Actions → Secrets → Repository secrets (inte Environment secrets). Se docs/testflight.md."
            exit 1
          fi
          SIGNING_DIR="$RUNNER_TEMP/signing"
          mkdir -p "$SIGNING_DIR"
          printf '%s\n' "$ASC_KEY_P8" > "$SIGNING_DIR/AuthKey.p8"
          chmod 600 "$SIGNING_DIR/AuthKey.p8"
          python3 scripts/testflight/asc.py fix-key "$SIGNING_DIR/AuthKey.p8"
          echo "SIGNING_DIR=$SIGNING_DIR" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$SIGNING_DIR/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Certifikat, profil och byggnummer
        id: asc
        run: python3 scripts/testflight/asc.py prepare --bundle-id "$BUNDLE_ID" --name Skovader --run-id "$GITHUB_RUN_ID" --out "$SIGNING_DIR"

      - name: Installera certifikat och profil
        env:
          PROFILE_UUID: ${{ steps.asc.outputs.profile_uuid }}
        run: |
          KEYCHAIN="$SIGNING_DIR/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          P12_PASSWORD="$(uuidgen)"
          # macOS egen openssl (LibreSSL) ger en .p12 som nyckelringen kan läsa.
          /usr/bin/openssl x509 -inform DER -in "$SIGNING_DIR/distribution.cer" -out "$SIGNING_DIR/distribution.pem"
          /usr/bin/openssl pkcs12 -export -inkey "$SIGNING_DIR/distribution.key" -in "$SIGNING_DIR/distribution.pem" \
            -out "$SIGNING_DIR/distribution.p12" -passout "pass:$P12_PASSWORD"
          curl -sSfL -o "$SIGNING_DIR/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$SIGNING_DIR/AppleWWDRCAG3.cer" -k "$KEYCHAIN" -T /usr/bin/codesign || true
          security import "$SIGNING_DIR/distribution.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$SIGNING_DIR/profile.mobileprovision" "$dir/$PROFILE_UUID.mobileprovision"
          done

      - name: Generera projektet
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate
          xcodebuild -version

      - name: Arkivera
        env:
          TEAM_ID: ${{ steps.asc.outputs.team_id }}
          BUILD_NUMBER: ${{ steps.asc.outputs.build_number }}
          PROFILE_NAME: ${{ steps.asc.outputs.profile_name }}
        run: |
          # Profilen sätts via SKOVADER_PROVISIONING_PROFILE så att den bara
          # gäller appmålet och inte Swift-paketets mål.
          xcodebuild archive \
            -project Skovader.xcodeproj \
            -scheme Skovader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Skovader.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            SKOVADER_BUNDLE_ID="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            SKOVADER_PROVISIONING_PROFILE="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            > "$RUNNER_TEMP/archive.log" 2>&1 && STATUS=0 || STATUS=$?
          grep -E "error:|\*\* ARCHIVE" "$RUNNER_TEMP/archive.log" | sort -u | tail -40 || true
          if [ "$STATUS" -ne 0 ]; then tail -80 "$RUNNER_TEMP/archive.log"; fi
          exit $STATUS

      - name: Ladda upp till App Store Connect
        env:
          TEAM_ID: ${{ steps.asc.outputs.team_id }}
          PROFILE_NAME: ${{ steps.asc.outputs.profile_name }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Skovader.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > "$RUNNER_TEMP/export.log" 2>&1 && STATUS=0 || STATUS=$?
          grep -iE "error|upload|\*\* EXPORT" "$RUNNER_TEMP/export.log" | sort -u | tail -40 || true
          if [ "$STATUS" -ne 0 ]; then tail -80 "$RUNNER_TEMP/export.log"; fi
          exit $STATUS

      - name: Sammanfattning
        env:
          APP_NAME: ${{ steps.asc.outputs.app_name }}
          BUILD_NUMBER: ${{ steps.asc.outputs.build_number }}
        run: |
          VERSION=$(grep -E '^\s+MARKETING_VERSION:' project.yml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          {
            echo "### $APP_NAME $VERSION ($BUILD_NUMBER) är uppladdad"
            echo "Apple bearbetar bygget i 10–30 minuter. Sedan finns det under TestFlight i App Store Connect."
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Städa
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          if [ -n "${SIGNING_DIR:-}" ]; then
            python3 scripts/testflight/asc.py cleanup --out "$SIGNING_DIR"
            rm -rf "$SIGNING_DIR"
          fi
