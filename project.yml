name: Skovader

options:
  bundleIdPrefix: no.linus
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: sv
  createIntermediateGroups: true

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

packages:
  SkovaderEngine:
    path: Engine

targets:
  Skovader:
    type: application
    platform: iOS
    sources:
      - App
      - Models
      - Views
      - Resources
    dependencies:
      - package: SkovaderEngine
    settings:
      base:
        PRODUCT_NAME: Skovader
        PRODUCT_BUNDLE_IDENTIFIER: $(SKOVADER_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Skoväder
        CFBundleDevelopmentRegion: sv
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Skoväder använder kameran så att du kan fotografera dina skor.
        NSPhotoLibraryUsageDescription: Skoväder behöver komma åt dina bilder så att du kan välja en bild på dina skor.
        NSLocationWhenInUseUsageDescription: Skoväder använder din plats för att hämta dagens väder där du är. Platsen sparas inte och skickas bara avrundad till vädertjänsten.
        # Appen använder bara standard-HTTPS (svar på exportfrågan om kryptering).
        ITSAppUsesNonExemptEncryption: false

  SkovaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/SkovaderTests
    dependencies:
      - target: Skovader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SKOVADER_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Skovader:
    build:
      targets:
        Skovader: all
        SkovaderTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - SkovaderTests
        - package: SkovaderEngine/SkovaderEngineTests
    archive:
      config: Release
